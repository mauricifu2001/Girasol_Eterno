<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala de juegos</title>
    <meta name="description" content="Un arcade con juegos para nosotros.">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="shortcut icon" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script defer src="config.js"></script>
    <script defer src="arcade.js"></script>
</head>
<body class="arcade-route">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <main class="shell arcade-shell">
        <section class="arcade-hero glass arcade-panel">
            <div class="arcade-hero-glow" aria-hidden="true"></div>
            <div class="arcade-hero-top">
                <div class="arcade-hero-copy">
                    <p class="eyebrow" id="arcadePageEyebrow">Sala de juegos</p>
                    <h1 id="arcadePageTitle">Arcade de nosotros</h1>
                    <p class="arcade-copy" id="arcadePageMessage"></p>
                </div>
                <div class="arcade-hero-actions">
                    <a class="secondary arcade-back" href="index.html" id="arcadeBackLink">Volver</a>
                    <label class="room-volume room-volume-compact" for="roomVolumeSlider">
                        <span class="room-volume-label">Volumen</span>
                        <input class="soundtrack-seek room-volume-slider" id="roomVolumeSlider" type="range" min="0" max="100" step="1" value="16" aria-label="Volumen de la musica">
                    </label>
                </div>
            </div>
        </section>

        <section class="arcade-gallery glass arcade-panel" id="arcadeGallery">
            <div class="arcade-ornaments" aria-hidden="true"></div>
            <div class="section-head arcade-gallery-head">
                <div>
                    <p class="eyebrow">Juegos</p>
                    <h2>Elige el que se nos antoje</h2>
                </div>
                <div class="soundtrack-head-actions">
                    <button class="ghost soundtrack-add" id="arcadeAddButton" type="button" aria-label="Agregar un juego">+</button>
                </div>
            </div>

            <div class="arcade-stage" id="arcadeStage">
                <div class="arcade-grid" id="arcadeGrid"></div>
            </div>

            <div class="arcade-empty hidden" id="arcadeEmpty">
                <h3>No hay juegos todavia</h3>
                <p>Cuando agreguemos uno, va a aparecer aqui.</p>
            </div>
        </section>
    </main>

    <div class="video-modal hidden" id="gameModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="gameModalTitle">
        <div class="video-modal-backdrop" data-close-game="true"></div>
        <div class="video-modal-card glass soundtrack-modal-card">
            <div class="video-modal-top">
                <div class="video-modal-copy">
                    <p class="eyebrow">Sala de juegos</p>
                    <h3 id="gameModalTitle">Agregar un juego</h3>
                </div>
                <button class="ghost video-modal-close" id="closeGameModalButton" type="button" aria-label="Cerrar">Cerrar</button>
            </div>

            <form class="soundtrack-modal-form" id="gameModalForm">
                <label class="soundtrack-modal-label" for="gameTitleInput">Nombre</label>
                <input
                    id="gameTitleInput"
                    type="text"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="Ej: Gartic Phone"
                    required
                >

                <label class="soundtrack-modal-label" for="gameUrlInput">Link</label>
                <input
                    id="gameUrlInput"
                    type="url"
                    inputmode="url"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="https://..."
                    required
                >

                <label class="soundtrack-modal-label" for="gameTagInput">Etiqueta (opcional)</label>
                <input
                    id="gameTagInput"
                    type="text"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="Ej: Multiplayer"
                >

                <label class="soundtrack-modal-label" for="gameNoteInput">Nota (opcional)</label>
                <input
                    id="gameNoteInput"
                    type="text"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="Ej: Para jugar juntos cuando se nos antoje"
                >

                <p class="tiny" id="gameModalStatus"></p>
                <div class="soundtrack-modal-actions">
                    <button class="secondary" id="cancelGameButton" type="button">Cancelar</button>
                    <button class="primary" id="saveGameButton" type="submit">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
